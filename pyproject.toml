[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-clarity"
version = "0.2.1"
description = "AI-native Git diff analyzer, conventional commit generator, and automated PR review assistant."
readme = "README.md"
authors = [
    { name = "Git Clarity Contributors" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance"
]
keywords = ["git", "ai", "cli", "conventional-commits", "code-review", "openai", "codex", "developer-tools"]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ai = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]

[project.scripts]
git-clarity = "git_clarity.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_clarity*"]
